name: Sincronizar Rastreio (Omie -> Vnda)

on:
  schedule:
    # A cada 20 min, das 08h às 18h40 (SP = UTC-3).
    # O GitHub descarta boa parte dos agendamentos (com 6/dia, só ~2 rodavam e com horas
    # de atraso). Com mais disparos, os que sobram cobrem o dia; cada run é curto porque
    # o estado em cache pula o que já foi sincronizado, e o concurrency evita sobreposição.
    # Minutos fora do :00 — o GitHub atrasa/descarta mais na hora cheia.
    - cron: '7,27,47 11-21 * * *'
  workflow_dispatch: {}

# Nunca dois runs ao mesmo tempo (evita rastreio duplicado e "requisição já em execução" no Omie)
concurrency:
  group: sync-rastreio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write   # necessário para o keep-alive reativar o workflow
    steps:
      # Repositório público: o GitHub desliga agendamentos após 60 dias sem commit
      # (aconteceu de 15/11 a 24/11/2026). Reativar a cada run renova esse prazo.
      - name: Keep-alive do agendamento
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-rastreio.yml/enable"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Restaurar estado (pedidos já sincronizados)
        uses: actions/cache@v4
        with:
          path: estado_rastreio.json
          key: estado-rastreio-${{ github.run_id }}
          restore-keys: estado-rastreio-

      - name: Rodar sincronizacao
        env:
          APP_KEY_OMIE:    ${{ secrets.APP_KEY_OMIE }}
          APP_SECRET:      ${{ secrets.APP_SECRET }}
          DIAS_RETROATIVOS: ${{ vars.DIAS_RETROATIVOS }}
          VNDA_BASE_URL:   ${{ secrets.VNDA_BASE_URL }}
          VNDA_TOKEN:      ${{ secrets.VNDA_TOKEN }}
          VNDA_SHOP_HOST:  ${{ secrets.VNDA_SHOP_HOST }}
        run: python main.py
